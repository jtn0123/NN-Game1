name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          npm ci
          npx playwright install chromium --with-deps

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Validate release config
        run: python .github/scripts/check_release_config.py

      - name: Type check focused core
        run: make typecheck

      - name: Dashboard JavaScript tests
        run: make dashboard-test

      - name: Dashboard browser smoke
        run: make dashboard-smoke

      - name: Performance smoke
        run: make perf-smoke

      - name: Test with coverage
        run: make coverage

      - name: Build package artifacts
        run: |
          python -m pip install build
          make build

  csharp-sim:
    # The standalone Unity game's C# simulation must match the Python golden traces.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Build simulation (warnings as errors)
        run: dotnet build unity/SimTests/Engine -c Release

      - name: Golden-trace parity
        run: dotnet test unity/SimTests/Tests -c Release

  unity-editor-checks:
    # Settings, controls, HUD feedback, snapshot parsing and the local C# backend,
    # run inside the real Unity editor. Personal activation uses the account
    # credentials directly; a legacy .ulf file is optional (see unity/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: unity-editor-license-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check Unity credentials
        id: credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" && -z "$UNITY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity editor checks skipped: Unity credentials are unavailable. Set UNITY_EMAIL and UNITY_PASSWORD in repository Actions secrets. Fork PRs do not receive these secrets."
            echo "Unity editor checks were **not run**: Unity credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Incomplete Unity setup: both UNITY_EMAIL and UNITY_PASSWORD must be set."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Unity Library
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: unity-library-Linux-StandaloneLinux64-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: unity-library-Linux-StandaloneLinux64-

      - name: Run Unity editor checks
        if: steps.credentials.outputs.ready == 'true'
        uses: game-ci/cli@7da0cea2f31799a4cbd79c1d452c254023f4f678 # v0.1.72
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          version: v0.1.72
          args: >-
            test --docker --engine=unity unity
            --testPlatforms=editmode
            --coverageEnabled=false
            --artifactsPath=unity-test-results
            --customParameters="-testFilter CrystalCaves.Pilot.Tests.EditorContractTests"

      - name: Verify all editor suites ran
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("unity-test-results/editmode-results.xml").getroot()
          cases = root.findall(".//test-case")
          if root.get("result") != "Passed" or len(cases) != 5 or any(case.get("result") != "Passed" for case in cases):
              raise SystemExit("Expected five passing editor suites with no skipped tests")
          print("All five Unity editor suites passed")
          PY

      - name: Upload Unity test results
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-editor-results
          path: unity-test-results/editmode-results.xml
          if-no-files-found: warn

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: make audit
